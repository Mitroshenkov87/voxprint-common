name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Write sha256 files
        run: |
          cd dist
          for archive in *.whl *.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
