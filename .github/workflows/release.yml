name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Write sha256 files
        run: |
          cd dist
          for archive in *.whl *.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          codename = json.load(open("BUILD.json", encoding="utf-8"))["codename"]
          url = (
              "https://github.com/Mitroshenkov87/voxprint-common/releases/download/"
              f"{tag}/voxprint_common-{version}-py3-none-any.whl"
          )
          notes = (
              f"Codename: {codename}.\n\n"
              "The wheel and sdist are the release assets. Each archive has a "
              ".sha256 file next to it. Offline installers vendor the wheel from "
              "this release instead of pinning a git commit.\n\n"
              f"Pin:\n\nvoxprint-common @ {url}\n"
          )
          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(notes)
          PY
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release create "$tag" dist/* \
            --title "voxprint-common ${version}" \
            --notes-file release-notes.md
