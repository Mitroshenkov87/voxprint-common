name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Docstrings
        run: python -m interrogate -c pyproject.toml src/voxprint_common
      - name: Tests
        run: python -m pytest
      - name: Docs
        if: runner.os == 'Linux'
        run: python -m mkdocs build --strict
      - name: Wheel
        run: python -m build
      - name: Install wheel
        run: python -c "import glob, subprocess, sys, zipfile; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; names = zipfile.ZipFile(wheels[0]).namelist(); assert any(name.endswith('voxprint_common/ui/tokens.json') for name in names), names; assert any(name.endswith('voxprint_common/py.typed') for name in names), names; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the site
        run: python -m mkdocs build --strict
